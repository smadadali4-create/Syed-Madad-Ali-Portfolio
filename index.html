<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Syed Madad Ali | Data Scientist</title>
  <meta name="description" content="Portfolio of Syed Madad Ali, a data scientist and analyst working with Python, Power BI and machine learning.">
  <meta name="theme-color" content="#0B0517">
  <meta property="og:title" content="Syed Madad Ali | Data Scientist">
  <meta property="og:description" content="Data science and analytics projects: Python, Power BI, scikit-learn.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://smadadali4-create.github.io/Syed-Madad-Ali-Portfolio/">
  <meta property="og:image" content="https://smadadali4-create.github.io/Syed-Madad-Ali-Portfolio/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <nav aria-label="Main">
      <a class="logo" href="#top">Ali</a>
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links"><span></span><span></span><span></span></button>
      <div class="links" id="nav-links"><a href="#about">About</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#projects">Projects</a><a href="#contact">Contact</a></div>
    </nav>

    <header id="top">
      <div class="intro">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div><small>Hi, I’m</small><h1 id="name"></h1></div>
      </div>
      <p class="role">I’m a <em id="type"></em><span class="caret" aria-hidden="true"></span></p>
      <p class="sub" id="summary"></p>
    </header>

    <section id="about">
      <h2 class="sec rv">About me</h2>
      <div class="about">
        <div class="about-text" id="about-text"></div>
        <aside class="facts rv" id="about-facts" aria-label="Quick facts"></aside>
      </div>
    </section>

    <section id="skills">
      <h2 class="sec rv">Skills</h2>
      <p class="looking" id="skills-lede" style="margin-top:0"></p>
      <div class="skills" id="skill-grid"></div>
    </section>

    <section id="experience">
      <h2 class="sec rv">Work experience</h2>
      <div class="cards" id="cards"></div>
      <p class="looking" id="looking"></p>
      <div class="icons" id="social-top"></div>
      <figure class="cluster-frame">
        <div class="cf-head"><i></i><i></i><i></i><span>K-Means clusters (illustrative)</span></div>
        <div class="stage"><canvas id="scene" aria-label="Rotating 3D scatter plot of three clusters"></canvas></div>
        <figcaption class="cf-foot">
          <span class="lg"><b style="--c:#A855F7"></b>Cluster 1</span>
          <span class="lg"><b style="--c:#E879F9"></b>Cluster 2</span>
          <span class="lg"><b style="--c:#38BDF8"></b>Cluster 3</span>
          <span class="note">Move your pointer over the chart to rotate it.</span>
        </figcaption>
      </figure>
    </section>

    <section id="projects">
      <h2 class="sec rv">Projects</h2>
      <div id="project-list"></div>
      <div class="more" id="more"></div>
    </section>

    <footer id="contact">
      <div class="contact-grid">
        <div class="contact-info">
          <h2 class="flush">Contact</h2>
          <p>Have a dataset, a dashboard to build or a role to fill? Send me a message.</p>
          <ul class="contact-list" id="contact-list"></ul>
          <div class="icons" id="social-bottom"></div>
        </div>

        <form class="form rv" id="contact-form" novalidate aria-labelledby="form-title">
          <h3 id="form-title">Leave your details</h3>
          <p class="form-sub">Share your name, email and contact number and I’ll get back to you.</p>
          <div class="field">
            <input id="f-name" name="name" type="text" autocomplete="name" placeholder=" " required aria-describedby="e-name">
            <label for="f-name">Name</label>
            <span class="err" id="e-name"></span>
          </div>
          <div class="field">
            <input id="f-email" name="email" type="email" autocomplete="email" placeholder=" " required aria-describedby="e-email">
            <label for="f-email">Email</label>
            <span class="err" id="e-email"></span>
          </div>
          <div class="field">
            <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder=" " required aria-describedby="e-phone">
            <label for="f-phone">Contact number</label>
            <span class="err" id="e-phone"></span>
          </div>
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="send" type="submit"><span>Send</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          <p class="status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
      <small id="copyright"></small>
    </footer>
  </div>

  <script src="content.js"></script>
  <script src="main.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="scene.js"></script>
</body>
</html>
